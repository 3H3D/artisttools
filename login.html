<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ferwap Artist Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">
            <h2>Ferwap Portal Access</h2>
            <p>Silakan login untuk mengakses data analitik & katalog.</p>
            
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Script khusus untuk menangani proses login Firebase -->
    <script type="module" src="auth.js"></script>
</body>
</html>
