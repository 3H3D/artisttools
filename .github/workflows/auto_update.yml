name: Auto Update Music Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python update_stats.py

      - name: Commit and Push Changes if Data Updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update music stats via GitHub Actions"
          branch: main
