<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap Artist Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. TAMPILAN FORM LOGIN (Muncul Pertama Kali) -->
    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2>Ferwap Portal Access</h2>
            <p>Silakan login untuk mengakses data analitik & katalog.</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- 2. TAMPILAN DASHBOARD (Tersembunyi Sebelum Login) -->
    <div id="dashboard-screen" class="dashboard-container" style="display: none;">
        <header>
            <div>
                <h1>Ferwap Artist Portal</h1>
                <p>Real-Time Analytics & Catalog Overview (3H3D)</p>
            </div>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </header>

        <!-- Bagian Statistik -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Streams</h3>
                <div class="value" id="total-streams">-</div>
            </div>
            <div class="stat-card">
                <h3>Monthly Listeners</h3>
                <div class="value" id="monthly-listeners">-</div>
            </div>
            <div class="stat-card">
                <h3>Estimated Earnings</h3>
                <div class="value" id="total-earnings">-</div>
            </div>
        </div>

        <!-- Bagian Tabel Katalog Rilis -->
        <h2 class="section-title">Catalog Performance & ISRC Registry</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Track Title</th>
                        <th>ISRC Code</th>
                        <th>Streams</th>
                        <th>Release Date</th>
                    </tr>
                </thead>
                <tbody id="releases-table-body">
                    <!-- Data dimuat oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK (Modular Version) -->
    <script type="module" src="app.js"></script>
</body>
</html>
